name: Publish the story

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the story for its project path
        run: npm run story:build
        env:
          PAGES_BASE: /sinaicore/
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run (needs admin on the repo token).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-story

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
